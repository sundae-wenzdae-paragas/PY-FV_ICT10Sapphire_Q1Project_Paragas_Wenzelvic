<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKU Generator</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
        
    <link rel="stylesheet" href="index.css">

    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script> 

</head>
<body>

<py-script src="main.py"></py-script>

<div class="container text-center">
        
<h1>SKU Generator</h1>
<h4>Generate SKU here!</h4>

    <div>
    <label for="category">Product Category</label>
    <br>
    <select id="category">
        <option value="Pizza">Pizza</option>
        <option value="Drinks">Drinks</option>
        <option value="Dessert">Dessert</option>
    </select>
</div>

<br>

<div>
    <label for="brand">Product Name</label>
    <br>
    <input type="text" id="brand">
</div>

<br>

<div>
    <label for="quantity">Stock Quantity</label>
    <br>
    <input type="number" id="quantity">
</div>

<br>

<button type="submit" py-click="GenerateSKU">
    Generate SKU
</button>

<div id="output" class="mt-4"></div>

</div>

</body>
</html>
