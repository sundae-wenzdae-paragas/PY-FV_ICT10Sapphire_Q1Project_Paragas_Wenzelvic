<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKU Generator</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
        
    <link rel="stylesheet" href="index.css">

    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script> 

<style>
    body{
        background-image:url(https://www.kingarthurbaking.com/sites/default/files/styles/featured_image_sm/public/2024-11/Personal-Pan-Pizzas_Hero1_HOR_BOTW_058.jpg?itok=2eX-_x8j);
        background-repeat:no-repeat;
        background-size: cover;
    margin: 0;
        font-family: Arial, sans-serif;
    }

    .navbar {
        background-color: rgb(174, 87, 47);
        padding: 15px;
        text-align: right;
    }

    .navbar a {
        color: white;
        text-decoration: none;
        margin: 0 20px;
        font-weight: bold;
    }

    .navbar a:hover {
        text-decoration: underline;
    }

    .container {
        background-color: bisque;
        width: 400px;
        margin: 40px auto;
        padding: 30px;
        border-radius: 20px;
        text-align: center;
    }
</style>

</head>
<body>

<py-script src="main.py"></py-script>

<nav class="navbar">
    <a href="index.html">Receipt Generator</a>
    <a href="sku.html">SKU Generator</a>
</nav>

<div class="container text-center">
        
<h1>SKU Generator</h1>
<h4>Generate SKU here!</h4>

    <div>
    <label for="category">Product Category</label>
    <br>
    <select id="category">
        <option value="Pizza">Pizza</option>
        <option value="Drinks">Drinks</option>
        <option value="Dessert">Dessert</option>
    </select>
</div>

<br>

<div>
    <label for="brand">Product Name</label>
    <br>
    <input type="text" id="brand">
</div>

<br>

<div>
    <label for="quantity">Stock Quantity</label>
    <br>
    <input type="number" id="quantity">
</div>

<br>

<button type="submit" py-click="GenerateSKU">
    Generate SKU
</button>

<div id="output" class="mt-4"></div>

</div>

</body>
</html>
